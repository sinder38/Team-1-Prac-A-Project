[pipeline]
prediction_date = "2026-06-08"  # W24

[stages]
almanac   = true
technical = true
macro     = true
evidence  = true
# Delta checks the previous locked prediction after matching actuals exist.
# Keep it off for normal prediction runs so the weekly pipeline does not fail early.
delta     = false

[delta]
prediction_week = "previous"
actuals_week = "auto"

[llm]
models = [
    {id = "nvidia/nemotron-3-super-120b-a12b:free"},
    {id = "tencent/hy3:free"},
    # {id = "openai/gpt-oss-120b:free"},
    {id = "google/gemma-4-31b-it:free"},
    {id = "poolside/laguna-m.1:free"},
]
max_retries = 5

[artifacts]
save_json = false
save_md   = true
