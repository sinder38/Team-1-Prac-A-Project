[project]
name = "market-prediction"
version = "0.1.0"
description = "Weekly market prediction pipeline — SPX, NDX, IWM"
requires-python = ">=3.12"
dependencies = [
    "yfinance>=0.2",
    "pandas>=2.0",
    "requests>=2.32",
    "openai>=2.41.1",
    "python-dotenv>=1.2.2",
    "flask>=3.0",
    "pydantic>=2.0",
    "playwright>=1.60.0",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyright>=1.1",
]