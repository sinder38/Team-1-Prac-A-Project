[artifacts]
save_json = false
save_md   = false

[llm]
max_retries = 3

# Models offered by the /stages/llm endpoint, keyed by slug.
# Frontend Stage 3 filters by provider: Local (ollama) vs Real API (openrouter).
models = [
    # Real API (OpenRouter) — needs OPENROUTER_API_KEY in .env
    {slug = "nemotron", id = "nvidia/nemotron-3-super-120b-a12b:free", provider = "openrouter"},
    {slug = "hy3",      id = "tencent/hy3:free", provider = "openrouter"},
    {slug = "gemm26",   id = "gemma-4-26b-a4b-it:free", provider = "openrouter"},
    {slug = "laguna",   id = "poolside/laguna-m.1:free", provider = "openrouter"},

    # Local (Ollama) — needs `ollama serve` + `ollama pull llama3.2:3b`
    {slug = "llama3.2-3b", id = "llama3.2:3b", provider = "ollama"},
]
