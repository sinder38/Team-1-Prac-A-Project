[artifacts]
save_json = false
save_md   = false

[database]
# Ingest the /data markdown archives into SQLite on server startup.
load_file_data = true

[llm]
max_retries = 3

# Models offered by the /stages/llm endpoint, keyed by slug.
models = [
    {slug = "example",                      id = "example/example:free"},
    # {slug = "gptoss",                     id = "openai/gpt-oss-120b:free",               name = "OpenAI gpt-oss-120b"}   # delisted 2026-07
    # {slug = "gemma",                      id = "google/gemma-4-31b-it:free",             name = "Google Gemma 4 31B"}    # superseded by 26B A4B (W29)
    # {slug = "laguna",                     id = "poolside/laguna-m.1:free",               name = "Poolside Laguna M.1"}   # delisted 2026-07
    # {slug = "nemotron-3-super-120b-a12b", id = "nvidia/nemotron-3-super-120b-a12b:free", name = "NVIDIA Nemotron 3 Super 120B"},
    # {slug = "ling-3.0-flash",            id = "inclusionai/ling-3.0-flash:free",         name = "InclusionAI Ling 3.0 Flash"},
    # {slug = "gemma-4-26b-a4b-it",        id = "gemma-4-26b-a4b-it:free",                 name = "Google Gemma 4 26B A4B"},
    # {slug = "gpt-oss-20b",               id = "openai/gpt-oss-20b:free",                 name = "OpenAI gpt-oss-20b"},
    # {slug = "laguna-xs-2.1",             id = "poolside/laguna-xs-2.1:free",             name = "Poolside Laguna XS 2.1"},

    # For local testing without OpenRouter (requires `ollama serve` + `ollama pull llama3.2:1b`).
    # llama3.2:1b is small enough to run at usable speed on CPU; llama3.1 (8B) takes
    # minutes per prompt without a GPU.
    {slug = "llama3.2-1b", id = "llama3.2:1b", provider = "ollama"},
    {slug = "qwen2.5-0.5b", id = "qwen2.5:1.5b", provider = "ollama"},
    {slug = "smollm2-1.7b", id = "smollm2:1.7b", provider = "ollama"},
]
