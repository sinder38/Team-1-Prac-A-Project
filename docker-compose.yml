services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - backend/.env
    volumes:
      - mi-outputs:/app/data/outputs
    expose:
      - "5000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        BASE_PATH: /market-intelligence/
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8002:80"
    restart: unless-stopped

volumes:
  mi-outputs:
