name: Weekly Pipeline

on:
  schedule:
    - cron: "0 14 * * 5" # Every Friday at 14:00 UTC — change time here
  workflow_dispatch:

jobs:
  run-pipeline:
    name: Run prediction pipeline
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Run pipeline
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: uv run python run_pipeline.py

      - name: Commit artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ../data/almanac/ ../data/technical/ ../data/evidence/ ../data/llm/
          git diff --cached --quiet || git commit -m "chore: pipeline artifacts $(date -u +%Y-%m-%d)"
          git push
